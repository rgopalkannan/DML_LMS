# Local full stack: PostgreSQL, API and web. Secrets come from .env (see server/.env.example); never commit it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lms
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms']
      interval: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lms:${POSTGRES_PASSWORD}@db:5432/lms?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: client/Dockerfile }
    ports: ['8080:80']
    depends_on: [api]
volumes:
  db-data:
